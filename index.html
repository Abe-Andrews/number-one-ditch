<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey to the Number One Ditch</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #120e18;
    color: #c8c0d8;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  #frame {
    padding: 10px;
    background: #2a2236;
    border-radius: 10px;
    box-shadow: 0 0 0 2px #3a3048, 0 20px 60px rgba(0, 0, 0, .6);
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
  #help {
    font-size: 12px;
    letter-spacing: .02em;
    opacity: .75;
    text-align: center;
    line-height: 1.6;
  }
  kbd {
    display: inline-block;
    padding: 0 6px;
    border-radius: 4px;
    background: #2a2236;
    border: 1px solid #4a3e5c;
    color: #f0e8ff;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div id="frame"><canvas id="screen" width="240" height="160"></canvas></div>
  <div id="help">
    <kbd>Arrows</kbd>/<kbd>WASD</kbd> move &nbsp;
    <kbd>Z</kbd> swing / talk &nbsp;
    <kbd>X</kbd> use item &nbsp;
    <kbd>Enter</kbd> menu (<kbd>Q</kbd>/<kbd>E</kbd> tabs) &nbsp;
    <kbd>M</kbd> mute
  </div>

  <script src="src/core.js?v=64"></script>
  <script src="src/font.js?v=64"></script>
  <script src="src/art.js?v=64"></script>
  <script src="src/world.js?v=64"></script>
  <script src="src/entities.js?v=64"></script>
  <script src="src/script.js?v=64"></script>
  <script src="src/ui.js?v=64"></script>
  <script src="src/content.js?v=64"></script>
  <script src="src/main.js?v=64"></script>
</body>
</html>
